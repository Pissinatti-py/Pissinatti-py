<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="840" height="210" role="img" aria-labelledby="t">
  <title id="t">Two strands, models from 2020 and backend from 2021, dotted with milestones and converging into one line at 2026 that fades toward what comes next</title>
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="650" y1="0" x2="820" y2="0">
      <stop offset="0" stop-color="#E0A93B" stop-opacity="1"/>
      <stop offset="1" stop-color="#E0A93B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- time axis -->
  <path d="M 80 110 H 650" fill="none" stroke="#6E7681" stroke-width="1" stroke-opacity="0.3"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8B949E" fill-opacity="0.55" letter-spacing="0.06em"><text x="80" y="104" text-anchor="middle">2020</text><text x="156" y="104" text-anchor="middle">2021</text><text x="232" y="104" text-anchor="middle">2022</text><text x="308" y="104" text-anchor="middle">2023</text><text x="384" y="104" text-anchor="middle">2024</text><text x="460" y="104" text-anchor="middle">2025</text><text x="536" y="104" text-anchor="middle">2026</text></g>
  <!-- strands -->
  <g fill="none" stroke="#6E7681" stroke-width="1.25" stroke-linecap="round">
    <path d="M 149.9 60 H 165.1"/>
    <path d="M 165.1 60 H 568" stroke-dasharray="2 5"/>
    <path d="M 568 60 C 608 60, 620 110, 650 110"/>
    <path d="M 178.0 160 H 568"/>
    <path d="M 568 160 C 608 160, 620 110, 650 110"/>
  </g>
  <g fill="#6E7681"><circle cx="149.9" cy="60" r="3"/><circle cx="159.0" cy="60" r="3"/><circle cx="165.1" cy="60" r="3"/><circle cx="178.0" cy="160" r="3"/><circle cx="286.0" cy="160" r="3"/><circle cx="346.0" cy="160" r="3"/><circle cx="422.0" cy="160" r="3"/><circle cx="490.4" cy="160" r="3"/><circle cx="568" cy="60" r="3"/><circle cx="568" cy="160" r="3"/></g>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8B949E" letter-spacing="0.06em">
    <text x="143.9" y="38" text-anchor="end">classifiers</text><text x="159.0" y="26" text-anchor="middle">CNN · RNN</text><text x="171.1" y="38" text-anchor="start">self-organising map</text><text x="178.0" y="178" text-anchor="middle">Django storefront</text><text x="286.0" y="192" text-anchor="middle">joins Samplemed</text><text x="346.0" y="178" text-anchor="middle">multi-tenant · MFA</text><text x="422.0" y="192" text-anchor="middle">Celery · Grafana</text><text x="490.4" y="178" text-anchor="middle">FastAPI boilerplates</text>
    <text x="574" y="80" text-anchor="end">LangGraph agents · RAG</text>
    <text x="574" y="148" text-anchor="end">Rust webhooks · 14k req/s</text>
  </g>
  <!-- now and the future -->
  <path d="M 650 110 H 820" fill="none" stroke="url(#fade)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="650" cy="110" r="4.5" fill="#E0A93B"/>
  <circle cx="780" cy="110" r="3.5" fill="none" stroke="#E0A93B" stroke-width="1.25" stroke-opacity="0.4"/>
  <text x="662" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="0.08em" fill="#E0A93B">2026 · now</text>
</svg>
